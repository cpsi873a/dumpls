<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biometría facial</title>
<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f8;
    }

    .phone {
        width: 320px;
        min-height: 100vh;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,.08);
    }

    .topbar {
        height: 52px;
        background: #2176d2;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        font-size: 14px;
        font-weight: 700;
    }

    .back {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 29px;
        line-height: 1;
        font-weight: 300;
    }

    .content {
        min-height: calc(100vh - 52px);
        padding: 76px 20px 35px;
        text-align: center;
    }

    .face-icon {
        width: 62px;
        height: 88px;
        margin: 0 auto 32px;
        position: relative;
    }

    /* Ilustración simple de teléfono/cámara */
    .hand {
        position: absolute;
        left: 20px;
        bottom: 0;
        width: 25px;
        height: 51px;
        background: #efbd91;
        transform: rotate(12deg);
        border-radius: 2px;
    }

    .phone-icon {
        position: absolute;
        left: 16px;
        top: 0;
        width: 31px;
        height: 58px;
        border: 2px solid #9da5ad;
        border-radius: 5px;
        background: #f4f6f8;
        z-index: 2;
    }

    .screen {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: 2px;
        height: 25px;
        background: #2176d2;
        border-radius: 2px;
    }

    .head {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #efbd91;
        top: 10px;
        left: 8px;
    }

    .face-dot {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #4d5660;
        top: 14px;
    }

    .face-dot.left { left: 11px; }
    .face-dot.right { left: 18px; }

    .camera {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #45515c;
        top: 4px;
        left: 12px;
    }

    .title {
        margin: 0 0 20px;
        color: #111;
        font-size: 18px;
        line-height: 1.35;
        font-weight: 700;
    }

    .description {
        width: 230px;
        margin: 0 auto;
        color: #777;
        font-size: 13px;
        line-height: 1.55;
    }

    .progress-wrap {
        width: 282px;
        max-width: 100%;
        margin: 40px auto 0;
    }

    .progress-bar {
        width: 100%;
        height: 10px;
        background: #e5e5e5;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-fill {
        width: 0%;
        height: 100%;
        background: #2176d2;
        border-radius: 10px;
        transition: width .05s linear;
    }

    .progress-text {
        margin-top: 10px;
        color: #777;
        font-size: 13px;
        font-weight: 700;
    }

    @media (max-width: 480px) {
        body {
            background: #fff;
        }

        .phone {
            width: 100%;
            box-shadow: none;
        }

        .content {
            padding-top: 76px;
        }

        .button {
            width: 100%;
        }
    }
</style>
</head>
<body>

<div class="phone">
    <header class="topbar">
        <span class="back" aria-hidden="true">‹</span>
        Biometría facial Banco General
    </header>

    <main class="content">
        <div class="face-icon" aria-hidden="true">
            <div class="hand"></div>
            <div class="phone-icon">
                <div class="camera"></div>
                <div class="head"></div>
                <div class="face-dot left"></div>
                <div class="face-dot right"></div>
                <div class="screen"></div>
            </div>
        </div>

        <h1 class="title">Utiliza tu biometría facial (rostro)</h1>

        <p class="description">
            Busca un lugar con buena iluminación,<br>
            mantén el celular de manera vertical y<br>
            sigue las indicaciones.
        </p>

        <!-- Barra de progreso visual -->
        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </main>
</div>

<script>
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('progressText');

    const duration = 10000;
    const start = Date.now();

    function cargar() {
        const elapsed = Date.now() - start;
        const percent = Math.min(100, (elapsed / duration) * 100);

        fill.style.width = percent + '%';
        text.textContent = Math.floor(percent) + '%';

        if (percent < 100) {
            requestAnimationFrame(cargar);
        } else {
            setTimeout(() => {
                window.location.href = '4.html';
            }, 100);
        }
    }

    cargar();
</script>

</body>
</html>
